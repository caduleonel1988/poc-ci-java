name: ci-poc-java-workflow

on: 
  pull_request:
    branches:
      - develop

jobs:
  matrix-check:
    name: Test with Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["8.0.462+8", "17.0.16+8"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      # - name: Run app
      #   run: ./gradlew bootRun

  check-app:
    name: check-app
    runs-on: ubuntu-latest
    needs: matrix-check
    steps:
      - name: Validate matrix results
        run: |
          echo "All matrix checks passed. Final check complete."
    
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: check-app
    steps:      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }} 

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: fadsfdsfdsf/ci-java-math-app:latest