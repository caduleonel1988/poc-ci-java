name: ci-poc-java-workflow

on: 
  pull_request:
    branches:
      - develop

jobs:
  matrix-check:
    # name: Test with Java ${ {matrix.java } }
    name: Test with Java 17
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     java: ["8.0.462+8", "17.0.16+8"]
    steps:          
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17.0.16+8
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test jacocoTestReport

      # - name: Run app
      #   run: ./gradlew bootRun

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info

      - name: Wait for SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PROJECT_KEY="caduleonel1988_poc-ci-java"   # ensure this matches build.gradle
          echo "Waiting for SonarCloud Quality Gate for $PROJECT_KEY"

          max_attempts=30
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."
            resp=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}")
            status=$(echo "$resp" | jq -r '.projectStatus.status // empty')

            # Treat empty or NONE as 'not ready' and keep polling
            if [ -z "$status" ] || [ "$status" = "NONE" ]; then
              echo "Quality Gate not ready yet (status: ${status:-empty}). Sleeping 10s..."
              sleep 10
              attempt=$((attempt + 1))
              continue
            fi

            echo "SonarCloud Quality Gate status: $status"
            if [ "$status" = "OK" ]; then
              echo "Quality Gate passed."
              exit 0
            else
              echo "::error ::SonarCloud Quality Gate is $status"
              exit 1
            fi
          done

          echo "::error ::Timed out waiting for SonarCloud Quality Gate (projectKey=${PROJECT_KEY})"
          exit 1

  check-app:
    name: check-app
    runs-on: ubuntu-latest
    needs: matrix-check
    steps:
      - name: Validate matrix results
        run: |
          echo "All matrix checks passed. Final check complete."

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: check-app
    steps:      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }} 

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: fadsfdsfdsf/ci-java-math-app:latest