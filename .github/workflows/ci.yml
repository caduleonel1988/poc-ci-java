name: ci-poc-java-workflow

on: 
  pull_request:
    branches:
      - develop

jobs:
  matrix-check:
    # name: Test with Java ${ {matrix.java } }
    name: Test with Java 17
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     java: ["8.0.462+8", "17.0.16+8"]
    steps:          
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17.0.16+8
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test jacocoTestReport

      # - name: Run app
      #   run: ./gradlew bootRun

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Build and publish analysis to SonarCloud
          ./gradlew build sonarqube -Dsonar.login=${SONAR_TOKEN} -Dsonar.host.url=https://sonarcloud.io --info

      - name: Wait for SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PROJECT_KEY="caduleonel1988_poc-ci-java"
          echo "Waiting for SonarCloud Quality Gate for $PROJECT_KEY"

          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "Detected branch: $BRANCH"

          get_status() {
            analyses_resp=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/project_analyses/search?project=${PROJECT_KEY}&branch=${BRANCH}&ps=1")
            echo "analyses response: $analyses_resp"
            ANALYSIS_ID=$(echo "$analyses_resp" | jq -r '.analyses[0].key // .analyses[0].id // empty')
            if [ -n "$ANALYSIS_ID" ]; then
              echo "Found analysis id for branch $BRANCH: $ANALYSIS_ID"
              curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}"
            else
              echo "No analysis found for branch $BRANCH, falling back to projectKey query"
              curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}"
            fi
          }

          # initial check
          resp=$(get_status)
          echo "project_status response: $resp"
          status=$(echo "$resp" | jq -r '.projectStatus.status // empty')

          # if still empty/NONE, run second analysis and re-check a few times
          if [ -z "$status" ] || [ "$status" = "NONE" ]; then
            echo "Quality Gate not computed yet (status: ${status:-empty}). Running a second analysis to force computation..."
            ./gradlew sonarqube -Dsonar.login=${SONAR_TOKEN} -Dsonar.host.url=https://sonarcloud.io --info || true
            sleep 5
            retries=6
            i=1
            while [ $i -le $retries ]; do
              echo "Re-check attempt $i/$retries..."
              resp=$(get_status)
              echo "project_status response: $resp"
              status=$(echo "$resp" | jq -r '.projectStatus.status // empty')
              if [ -n "$status" ] && [ "$status" != "NONE" ]; then
                break
              fi
              sleep 5
              i=$((i + 1))
            done
          fi

          if [ -z "$status" ] || [ "$status" = "NONE" ]; then
            echo "::error ::Timed out or gate still not computed (status: ${status:-empty})."
            exit 1
          fi

          echo "SonarCloud Quality Gate status: $status"
          if [ "$status" = "OK" ]; then
            echo "Quality Gate passed."
            exit 0
          else
            echo "::error ::SonarCloud Quality Gate is $status"
            exit 1
          fi

  check-app:
    name: check-app
    runs-on: ubuntu-latest
    needs: matrix-check
    steps:
      - name: Validate matrix results
        run: |
          echo "All matrix checks passed. Final check complete."

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: check-app
    steps:      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }} 

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: fadsfdsfdsf/ci-java-math-app:latest